<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Rubik Timer</title>
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>

  <!-- The three visible faces of a speed cube. -->
  <path d="M256 70 426 168 256 266 86 168Z" fill="#facc15"/>
  <path d="M86 168 256 266V462L86 364Z" fill="#22c55e"/>
  <path d="M426 168 256 266V462l170-98Z" fill="#ef4444"/>

  <!-- Sticker seams stay visible at larger sizes without making the 16 px mark noisy. -->
  <g fill="none" stroke="#0a0a0a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="m143 135 170 98M199 103l170 98M369 135 199 233M313 103 143 201"/>
    <path d="M143 201v196M199 233v196M86 233l170 98M86 299l170 98"/>
    <path d="M369 201v196M313 233v196M256 331l170-98M256 397l170-98"/>
  </g>

  <!-- A timer dial at the cube's central axis. -->
  <circle cx="256" cy="266" r="54" fill="#0a0a0a" stroke="#fafafa" stroke-width="17"/>
  <path d="M256 266v-35M256 266l31-22" fill="none" stroke="#fafafa" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="266" r="9" fill="#fafafa"/>
</svg>
